<svg xmlns="http://www.w3.org/2000/svg" width="900" height="250" viewBox="0 0 900 250">
<defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#245b8f"/></marker></defs>
<rect width="900" height="250" rx="18" fill="#f7fafc"/><text x="450" y="38" text-anchor="middle" font-family="Arial" font-size="22" font-weight="bold" fill="#17324d">What the compact models pass through the circuit</text>
<text x="55" y="112" font-family="Arial" font-size="17" fill="#17324d">Input field</text><text x="55" y="143" font-family="Arial" font-size="20" font-weight="bold" fill="#245b8f">a<tspan baseline-shift="sub" font-size="13">in</tspan></text>
<line x1="130" y1="128" x2="265" y2="128" stroke="#245b8f" stroke-width="4" marker-end="url(#a)"/>
<rect x="280" y="82" width="330" height="92" rx="12" fill="#e3eff8" stroke="#5b8db8" stroke-width="2"/><text x="445" y="116" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold" fill="#17324d">Waveguide model</text><text x="445" y="145" text-anchor="middle" font-family="Arial" font-size="16" fill="#17324d">phase delay + amplitude attenuation</text>
<line x1="610" y1="128" x2="735" y2="128" stroke="#245b8f" stroke-width="4" marker-end="url(#a)"/><text x="750" y="116" font-family="Arial" font-size="17" fill="#17324d">Output field</text><text x="750" y="146" font-family="Arial" font-size="20" font-weight="bold" fill="#245b8f">a<tspan baseline-shift="sub" font-size="13">out</tspan> = H a<tspan baseline-shift="sub" font-size="13">in</tspan></text>
<rect x="115" y="192" width="275" height="40" rx="8" fill="#fff" stroke="#d2dce5"/><text x="252" y="218" text-anchor="middle" font-family="Arial" font-size="15" fill="#17324d">Complex amplitude: H</text>
<rect x="510" y="192" width="275" height="40" rx="8" fill="#fff" stroke="#d2dce5"/><text x="647" y="218" text-anchor="middle" font-family="Arial" font-size="15" fill="#17324d">Power transmission: |H|²</text>
</svg>